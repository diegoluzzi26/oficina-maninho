# Landing page de vendas (oficinahub.com.br). O Caddy repassa o Host original,
# então o nginx separa landing e sistema pelo nome do domínio.
# landing.localhost serve pra testar localmente: http://landing.localhost:8080
server {
    listen 80;
    server_name oficinahub.com.br www.oficinahub.com.br landing.localhost;
    root /usr/share/nginx/landing;
    index index.html;

    # Quem ainda acessa o login pelo domínio raiz vai pro sistema
    location /login {
        return 302 https://app.oficinahub.com.br$request_uri;
    }

    # HTML sem cache: mudança de texto/preço aparece na hora pros anúncios
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}

# Sistema (app.oficinahub.com.br e qualquer outro domínio)
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Repassa chamadas de API para o container da API.
    # Assim o navegador só conversa com uma origem: sem CORS.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets com hash no nome podem ser cacheados agressivamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
