# Um domínio só (oficinahub.com.br):
#   /       landing de vendas (frontend/landing)
#   /app/   sistema (build do Vite, base '/app/'; rotas no hash: /app/#/login)
#   /api/   API Node
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/site;
    index index.html;
    # Redirect relativo: atrás do Caddy (HTTPS) não pode voltar pra http://
    absolute_redirect off;

    # Repassa chamadas de API para o container da API.
    # Assim o navegador só conversa com uma origem: sem CORS.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Atalho de login a partir da landing ou de link antigo
    location = /login {
        return 302 /app/#/login;
    }

    location = /app {
        return 301 /app/;
    }

    # Assets com hash no nome podem ser cacheados agressivamente
    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML sem cache: deploy novo do sistema aparece na hora
    location = /app/index.html {
        add_header Cache-Control "no-cache";
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # HTML sem cache: mudança de texto/preço aparece na hora pros anúncios
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
